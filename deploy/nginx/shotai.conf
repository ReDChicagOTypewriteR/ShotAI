# ShotAI 网页与 Ollama 同源代理示例。
# 将 root 修改为 ShotAI dist 目录，并按实际情况修改 listen/server_name。
server {
    listen 9090;
    server_name _;

    root /opt/shotai/web;
    index index.html;

    client_max_body_size 32g;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    # 不要为此 location 配置 limit_except GET。
    # /api/show、/api/chat、/api/create 和模型上传都需要 POST。
    location /ollama/ {
        proxy_pass http://127.0.0.1:11434/;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:11434;
        # ShotAI 对浏览器保持同源；不要把内网 IP 对应的 Origin 传给 Ollama，
        # 否则 Ollama 会拒绝 POST /api/show、/api/chat 并返回 403。
        proxy_set_header Origin "";
        proxy_set_header Referer "";
        proxy_set_header X-ShotAI-Proxy "nginx";
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # stable-diffusion.cpp 图片创作服务，默认只监听主机 1234 端口。
    location /image/ {
        proxy_pass http://127.0.0.1:1234/;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:1234;
        proxy_set_header Origin "";
        proxy_set_header Referer "";
        proxy_set_header X-ShotAI-Proxy "nginx-image";
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"ShotAI Web"}';
    }
}
