  <text x="64" y="258" fill="#f4f7f8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="82px" font-weight="800" text-anchor="start" opacity="1"><tspan x="64" dy="0">主机负责模型</tspan><tspan x="64" dy="93">其他电脑负责使用</tspan></text>
  <text x="68" y="469" fill="#aeb9bc" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="26px" font-weight="500" text-anchor="start" opacity="1"><tspan x="68" dy="0">默认只有主机能添加、删除和重载模型。</tspan><tspan x="68" dy="35">内网浏览器主要负责提交任务。</tspan></text>
